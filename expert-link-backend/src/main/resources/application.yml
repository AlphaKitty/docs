server:
  port: 8888
  servlet:
    context-path: /api

spring:
  application:
    name: expert-link
  
  # Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/expertlink_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  
  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  # File Upload Configuration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# JWT Configuration
jwt:
  secret: expertlink-jwt-secret-key-change-in-production
  expiration: 86400000 # 24 hours in milliseconds
  issuer: expert-link

# Application Configuration
app:
  bootstrap-admin:
    enabled: true
    username: admin
    email: admin@expertlink.local
    password: ChangeMe!Admin1
  file:
    upload-dir: ./uploads
    max-size: 10485760 # 10MB
  cors:
    allowed-origins: http://localhost:3333,http://localhost:3000
    allowed-methods: GET, POST, PUT, DELETE, OPTIONS
    allowed-headers: "*"
    allow-credentials: true
  
  # Pagination defaults
  pagination:
    default-page-size: 20
    max-page-size: 100

# Logging Configuration
logging:
  level:
    com.expertlink: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  file:
    name: logs/expert-link.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always