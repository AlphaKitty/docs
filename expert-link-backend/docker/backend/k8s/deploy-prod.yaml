kind: Deployment
apiVersion: apps/v1
metadata:
  name: expert-link-deploy
  namespace: bpit-common
  labels:
    app.kubernetes.io/name: expert-link-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: expert-link-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: expert-link-backend
    spec:
      volumes:
        - name: host-time
          hostPath:
            path: /etc/localtime
            type: ''
        - name: log
          emptyDir: {}
      containers:
        - name: expert-link-container
          image: >-
            harbor.goertek.com/bpit-common-release/expert-link:{{version}}
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
          args:
            - '--spring.profiles.active=prod'
          resources:
            limits:
              cpu: '2'
              memory: 4000Mi
            requests:
              cpu: 100m
              memory: 500Mi
          volumeMounts:
            - name: host-time
              readOnly: true
              mountPath: /etc/localtime
            - name: log
              mountPath: /app/log
          imagePullPolicy: IfNotPresent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
